<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A League of Legends match schedule, results, and LCK standings dashboard." />
    <title>JUSTIN · GAME · WATCH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#">
        <span class="brand-muted">JUSTIN</span> · GAME · <span class="brand-muted">WATCH</span>
      </a>
      <button class="refresh-button" id="refresh-button" type="button">
        <span class="refresh-icon">↻</span> Refresh
      </button>
    </header>

    <main>
      <section class="toolbar" id="matches">
        <div class="match-tabs" id="match-tabs" role="tablist" aria-label="LCK match schedule">
          <button class="match-tab" id="tab-previous" type="button" role="tab" data-tab="previous" aria-selected="false" aria-controls="match-panel">Previous</button>
          <button class="match-tab is-active" id="tab-today" type="button" role="tab" data-tab="today" aria-selected="true" aria-controls="match-panel">Today</button>
          <button class="match-tab" id="tab-next" type="button" role="tab" data-tab="next" aria-selected="false" aria-controls="match-panel">Next</button>
        </div>
      </section>

      <div class="content-grid">
        <section class="matches-panel" id="match-panel" role="tabpanel" aria-labelledby="tab-today" tabindex="0">
          <div class="section-heading">
            <div><h2 id="match-heading">Today's matches</h2></div>
            <span class="updated" id="updated">Times shown in Hong Kong (UTC+8)</span>
          </div>
          <div class="match-list" id="match-list"></div>
          <div class="empty-state" id="empty-state" hidden>No LCK matches found for this period.</div>
        </section>
        <aside class="standings-panel">
          <div class="section-heading"><div><h2>LCK leaderboard</h2></div><span class="updated">Series · Games</span></div>
          <ol class="standings-list" id="standings-list"></ol>
        </aside>
      </div>
    </main>

    <footer id="results"><span>© 2026 Justin Game Watch</span><span>Built for fun · Debugging version</span></footer>
    <script src="app.js"></script>
  </body>
</html>
